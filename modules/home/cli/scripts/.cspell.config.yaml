---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
language:
  - "en"
  - "en-GB"
ignorePaths:
  - ".git"
  - ".venv"
  - "node_modules"
ignoreRegExpList:
  - "Base64"
  - "Base64MultiLine"
  - "Base64SingleLine"
  - "CommitHash"
  - "CommitHashLink"
  - "Email"
  - "HexValues"
  - "PublicKey"
  - "SSA"
  - "Urls"
  # Custom Patterns
  - "GitHubLinks"
patterns:
  - name: "GitHubLinks"
    pattern: /\bgithub:[\w.-]+\/[\w.-]+/g
dictionaryDefinitions:
  - name: "personal"
    path: "./.cspell-personal.txt"
    addWords: true
# Enabled by default (no need to list): aws, companies, cryptocurrencies,
# filetypes, software-terms, web-services.
# Language dictionaries auto-enable per filetype; listing them here applies
# them to every file (e.g. markdown, commit messages).
dictionaries:
  - "csharp"
  - "css"
  - "data-science"
  - "docker"
  - "dotnet"
  - "fullstack"
  - "gaming-terms"
  - "git"
  - "golang"
  - "html"
  - "k8s"
  - "makefile"
  - "networking-terms"
  - "node"
  - "npm"
  - "personal"
  - "php"
  - "powershell"
  - "python"
  - "ruby"
  - "shellscript"
  - "sql"
  - "terraform"
  - "typescript"
